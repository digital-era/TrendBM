<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 访问守卫：必须放在最前面，且不要加 async / defer -->
  <script src="/scripts/guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendBM · 智源每周热点</title>
  <meta name="description" content="智源每周热点 · 生物医学" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #12161f;
      --border: rgba(255, 255, 255, 0.07);
      --text: #e8ecf4;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(245, 158, 11, 0.10), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(56, 189, 248, 0.06), transparent);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.25);
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 20%, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      max-width: 640px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .card-top { height: 3px; width: 100%; }
    .card.ht .card-top { background: linear-gradient(90deg, #f472b6, #ec4899); }

    .card-body {
      padding: 22px 20px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      background: rgba(244, 114, 182, 0.12);
    }

    .card-title { font-size: 1.15rem; font-weight: 600; }
    .card-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 1px; }

    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .file-item a {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 11px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.18s ease;
      border: 1px solid transparent;
      line-height: 1.4;
    }

    .file-item a:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border);
    }

    .file-icon {
      flex-shrink: 0;
      margin-top: 1px;
      opacity: 0.65;
      font-size: 0.95rem;
    }

    .file-name {
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    .arrow {
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-4px);
      transition: all 0.18s ease;
      color: var(--accent);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    .file-item a:hover .arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .status {
      color: var(--text-muted);
      font-size: 0.88rem;
      padding: 16px 0;
      text-align: center;
    }

    .status.error { color: #f87171; }

    /* ========== 同页阅读层 ========== */
    .reader-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s;
    }
    
    .reader-overlay.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    
    .reader-header {
      flex-shrink: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(18, 22, 31, 0.95);
      backdrop-filter: blur(10px);
    }
    
    .reader-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: #e8ecf4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 70%;
    }
    
    .reader-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .reader-actions a,
    .reader-actions button {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    
    .reader-actions a:hover,
    .reader-actions button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #e8ecf4;
    }
    
    .reader-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #0f1419;
    }

    footer {
      text-align: center;
      margin-top: 56px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">🧬</div>
        <h1>TrendBM</h1>
      </div>
      <p class="subtitle">生物医学每周热点图谱</p>
    </header>
    
    <div class="grid">
      <section class="card ht">
        <div class="card-top"></div>
        <div class="card-body">
          <div class="card-header">
            <div class="card-icon">🔥</div>
            <div>
              <div class="card-title">智源每周热点</div>
              <div class="card-desc">SmartOrigin Weekly Hot Topics</div>
            </div>
          </div>
          <ul class="file-list" id="list-ht">
            <li class="status">加载中...</li>
          </ul>
        </div>
      </section>
    </div>

    <footer>
      <p>Powered by AI范式进化</p>
    </footer>
  </div>
  
  <!-- 热点事件同页阅读层 -->
  <div id="readerOverlay" class="reader-overlay" aria-hidden="true">
    <div class="reader-header">
      <div class="reader-title" id="readerTitle">智源每周热点</div>
      <div class="reader-actions">
        <a id="readerOpenNew" href="#" target="_blank" rel="noopener" title="在新标签打开">↗</a>
        <button id="readerClose" title="关闭">✕</button>
      </div>
    </div>
    <iframe id="readerFrame" class="reader-frame" title="报告内容"></iframe>
  </div>

  <script>
    // ========== 配置 ==========
    const REPO = 'digital-era/TrendBM'; // 请替换为实际仓库路径
    const BRANCH = 'main';
    const SITE_ORIGIN = 'https://trendbm.aivibeinvest.com'; // 请替换为实际站点域名
    
    // 美化显示名称
    function prettyName(filename) {
      // 移除扩展名
      let name = filename.replace(/\.html$/i, '');
      // 提取日期
      const dateMatch = name.match(/(\d{4}[-.]\d{2}[-.]\d{2})/);
      if (dateMatch) {
        const date = dateMatch[1].replace(/\./g, '-');
        // 移除原文件名中的日期部分，保留前缀
        let prefix = name.replace(dateMatch[0], '').replace(/_/g, ' ').trim();
        if (prefix) {
          return `${prefix} · ${date}`;
        }
        return date;
      }
      // 如果没有日期，就把下划线换成 ·
      return name.replace(/_/g, ' · ');
    }
    
    // 从文件名提取日期（用于排序），没有日期返回 0
    function extractDateFromName(name) {
      const m = name.match(/(\d{4})[-.](\d{2})[-.](\d{2})/);
      if (!m) return 0;
      return new Date(`${m[1]}-${m[2]}-${m[3]}`).getTime();
    }
    
    // 获取某个目录下的所有 .html 文件（只请求一次）
    async function fetchDirFiles(dir) {
      const url = `https://api.github.com/repos/${REPO}/contents/${dir}?ref=${BRANCH}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`目录 ${dir} 加载失败 (${res.status})`);
      const data = await res.json();
      return data.filter(item => item.type === 'file' && /\.html$/i.test(item.name));
    }
    
    let readerOpen = false;
    
    function openReader(url, title) {
      const overlay = document.getElementById('readerOverlay');
      const frame = document.getElementById('readerFrame');
      const titleEl = document.getElementById('readerTitle');
      const openNew = document.getElementById('readerOpenNew');
    
      titleEl.textContent = title || '智源每周热点';
      openNew.href = url;
    
      // 先清空，避免旧内容闪一下
      frame.src = 'about:blank';
    
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      readerOpen = true;
    
      // 只推一次历史（用 hash，便于识别）
      if (location.hash !== '#reader') {
        history.pushState({ reader: true }, '', '#reader');
      }
    
      // 同域用 replace，减少 iframe 额外历史记录
      frame.onload = function () {
        frame.onload = null;
        try {
          frame.contentWindow.location.replace(url);
        } catch (e) {
          frame.src = url;
        }
      };
      // 触发一次 about:blank 的 onload
      frame.src = 'about:blank';
    }
    
    function closeReader(fromPopstate) {
      if (!readerOpen && !document.getElementById('readerOverlay').classList.contains('open')) {
        return;
      }
    
      const overlay = document.getElementById('readerOverlay');
      const frame = document.getElementById('readerFrame');
    
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      readerOpen = false;
    
      // 立刻清空，避免出现「只剩标题的黑页」
      frame.src = 'about:blank';
    
      // 仅在点 ✕ / ESC 时主动退历史；浏览器后退触发的 popstate 不再 back
      if (!fromPopstate && location.hash === '#reader') {
        history.back();
      } else if (location.hash === '#reader') {
        // popstate 后若 hash 还在，清掉（兼容部分浏览器）
        history.replaceState(null, '', location.pathname + location.search);
      }
    }
    
    // 关闭按钮 / ESC
    document.getElementById('readerClose').addEventListener('click', () => closeReader(false));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeReader(false);
    });
    
    // 浏览器后退 / 前进
    window.addEventListener('popstate', () => {
      if (readerOpen || document.getElementById('readerOverlay').classList.contains('open')) {
        closeReader(true);
      }
    });
    
    // 渲染列表（同页打开）
    function renderList(containerId, files, dir) {
      const ul = document.getElementById(containerId);
      if (!files.length) {
        ul.innerHTML = '<li class="status">暂无文件</li>';
        return;
      }
    
      ul.innerHTML = files.map(file => {
        const display = prettyName(file.name);
        const href = `${SITE_ORIGIN}/${dir}/${encodeURIComponent(file.name)}`;
    
        return `
          <li class="file-item">
            <a href="javascript:void(0)" title="${file.name}"
               data-reader-url="${href}" data-reader-title="${display}">
              <span class="file-icon">📄</span>
              <span class="file-name">${display}</span>
              <span class="arrow">→</span>
            </a>
          </li>
        `;
      }).join('');
    
      ul.querySelectorAll('a[data-reader-url]').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          openReader(a.dataset.readerUrl, a.dataset.readerTitle);
        });
      });
    }
    
    // ========== 主加载逻辑 ==========
    async function loadAll() {
      try {
        const files = await fetchDirFiles('ht');
    
        // 按文件名中的日期倒序（最新在前），没有日期的排后面
        files.sort((a, b) => {
          const da = extractDateFromName(a.name);
          const db = extractDateFromName(b.name);
          if (db !== da) return db - da;
          return b.name.localeCompare(a.name, 'zh');
        });
    
        renderList('list-ht', files, 'ht');
      } catch (err) {
        console.error('ht', err);
        const el = document.getElementById('list-ht');
        if (el) {
          el.innerHTML = `<li class="status error">加载失败：${err.message}</li>`;
        }
      }
    }
    
    // 页面加载后执行
    loadAll();
  </script>
</body>
</html>
